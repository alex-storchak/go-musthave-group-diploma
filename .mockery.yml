    interfaces:
      OrdersRepository:
      RulesRepository:
  github.com/alex-storchak/go-musthave-group-diploma/internal/accrual/handler:
    interfaces:
      RuleRegisterer:
      OrderRegisterer:
      OrderInformer:
  github.com/alex-storchak/go-musthave-group-diploma/internal/accrual/worker:
    interfaces:
      RulesProvider:
  github.com/alex-storchak/go-musthave-group-diploma/internal/validator:
    interfaces:
      Validator:
  github.com/alex-storchak/go-musthave-group-diploma/internal/gophermart/handler/api/auth:
    interfaces:
      UserRegisterer:
      UserLoginer:
  github.com/alex-storchak/go-musthave-group-diploma/internal/gophermart/handler/middleware:
    interfaces:
      AuthUserValidator:
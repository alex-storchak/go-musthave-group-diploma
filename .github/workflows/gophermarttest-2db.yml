name: gophermarttest-2db

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:

  build:
    runs-on: ubuntu-latest
    container: golang:1.24

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: praktikum
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Download autotests binaries
        uses: robinraju/release-downloader@v1.8
        with:
          repository: Yandex-Practicum/go-autotests-bin
          latest: true
          fileName: "*"
          out-file-path: .tools
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup autotest binary
        run: |
          chmod -R +x $GITHUB_WORKSPACE/.tools
          mv $GITHUB_WORKSPACE/.tools/gophermarttest /usr/local/bin/gophermarttest
          mv $GITHUB_WORKSPACE/.tools/random /usr/local/bin/random

      - name: Build binaries
        run: |
          (cd cmd/gophermart && go build -buildvcs=false -o gophermart)
          (cd cmd/accrual && go build -buildvcs=false -o accrual)

      - name: Prepare databases
        run: |
          apt-get update && apt-get install -y postgresql-client
          until pg_isready -h postgres -p 5432 -U postgres; do sleep 1; done
          PGPASSWORD=postgres psql -h postgres -U postgres -d postgres -c "CREATE DATABASE praktikum_gophermart;"
          PGPASSWORD=postgres psql -h postgres -U postgres -d postgres -c "CREATE DATABASE praktikum_accrual;"

      - name: Test
        run: |
          gophermarttest \
          -test.v -test.run=^TestGophermart$ \
          -gophermart-binary-path=cmd/gophermart/gophermart \
          -gophermart-host=localhost \
          -gophermart-port=8080 \
          -gophermart-database-uri="postgresql://postgres:postgres@postgres/praktikum_gophermart?sslmode=disable" \
          -accrual-binary-path=cmd/accrual/accrual \
          -accrual-host=localhost \
          -accrual-port=$(random unused-port) \
          -accrual-database-uri="postgresql://postgres:postgres@postgres/praktikum_accrual?sslmode=disable"

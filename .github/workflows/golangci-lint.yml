name: golangci-lint.yml

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - master
      - iter

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          cache: 'true'
          go-version-file: go.mod

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.5.0
          args: '--timeout=10m'